<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>IT Check Dashboard</title>
  <style>
    :root { color-scheme: light; font-family: Sarabun, Tahoma, system-ui, sans-serif; color: #334155; background: #f8fafc; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .viewport { position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .loading {
      z-index: 1; display: grid; place-items: center; background: #f8fafc;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      text-align: center; opacity: 1; visibility: visible;
      transition: opacity 240ms ease, visibility 0s linear 240ms;
    }
    .loading.is-loaded { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading[hidden], [hidden] { display: none; }
    .content { max-width: 28rem; }
    h1 { margin: 20px 0 8px; font: 600 clamp(1.25rem, 4vw, 1.65rem)/1.4 system-ui, sans-serif; }
    p { margin: 0; line-height: 1.7; }
    .spinner { display: block; width: 44px; height: 44px; margin: auto; border: 3px solid #d9e9e6; border-top-color: #0f766e; border-radius: 50%; animation: spin 900ms linear infinite; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 20px; }
    button { min-height: 44px; padding: 10px 18px; border: 1px solid #0f766e; border-radius: 8px; background: #0f766e; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { color: #0f766e; background: #fff; }
    button:focus-visible { outline: 3px solid #334155; outline-offset: 3px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .loading { transition: none; } }
  </style>
</head>
<body>
  <main class="viewport" aria-label="IT Check Dashboard">
    <!-- The source URL is visible in browser tools. This wrapper is not a secrecy mechanism. -->
    <iframe id="app" title="IT Check Dashboard" scrolling="no" allow="fullscreen" allowfullscreen></iframe>
  </main>
  <div id="loading" class="viewport loading">
    <div class="content">
      <span class="spinner" aria-hidden="true"></span>
      <h1>IT Check Dashboard</h1>
      <p id="status" role="status" aria-live="polite">กำลังโหลดแดชบอร์ด…</p>
      <div id="actions" class="actions" hidden>
        <button id="retry" type="button">ลองโหลดอีกครั้ง</button>
        <button id="continue" class="secondary" type="button">ดูหน้าที่โหลดอยู่</button>
      </div>
    </div>
  </div>
  <noscript><style>#loading { display: none; }</style><p>กรุณาเปิด JavaScript แล้วโหลดหน้าใหม่เพื่อใช้งานแดชบอร์ด</p></noscript>
  <script>
    (() => {
      'use strict';
      const APP_URL = 'https://script.google.com/macros/s/AKfycbzydtgBlVvhbpTqXiGrOQIYg6uvieSQxPhAFcINIjWL_E5W6lQ4iO3zKNfpLFgsqbbkZw/exec?page=dashboard';
      const frame = document.getElementById('app');
      const loading = document.getElementById('loading');
      const status = document.getElementById('status');
      const actions = document.getElementById('actions');
      let timeout;
      let hideTimeout;

      function reveal() {
        clearTimeout(timeout);
        loading.classList.add('is-loaded');
        // A load event means the frame document loaded, not that dashboard data is ready.
        // Cross-origin policy prevents checking Google error/login pages from here.
        hideTimeout = setTimeout(() => { loading.hidden = true; }, 260);
        if (loading.contains(document.activeElement)) frame.focus();
      }

      function offerRecovery(message) {
        status.textContent = message;
        actions.hidden = false;
      }

      function load() {
        clearTimeout(timeout);
        clearTimeout(hideTimeout);
        loading.hidden = false;
        loading.classList.remove('is-loaded');
        actions.hidden = true;
        status.textContent = 'กำลังโหลดแดชบอร์ด…';
        timeout = setTimeout(() => offerRecovery('ใช้เวลาโหลดนานกว่าปกติ ตรวจสอบอินเทอร์เน็ต หรือลองโหลดอีกครั้ง'), 20000);
        frame.src = APP_URL;
      }

      frame.addEventListener('load', reveal);
      frame.addEventListener('error', () => {
        clearTimeout(timeout);
        offerRecovery('โหลดแดชบอร์ดไม่ได้ ตรวจสอบอินเทอร์เน็ต แล้วลองอีกครั้ง');
      });
      document.getElementById('retry').addEventListener('click', load);
      document.getElementById('continue').addEventListener('click', reveal);
      load();
    })();
  </script>
</body>
</html>
